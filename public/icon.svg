<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.35" />
  
  <!-- Central HUD Robot & Mobile Sightline Graphic -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <!-- Outer radar ring -->
    <circle cx="150" cy="150" r="130" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="24 16" opacity="0.6" />
    <!-- Device frame -->
    <rect x="65" y="40" width="170" height="220" rx="24" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="8" />
    <!-- Screen area -->
    <rect x="77" y="60" width="146" height="175" rx="14" fill="#020617" />
    <!-- Camera lens / Notch -->
    <circle cx="150" cy="50" r="4" fill="#38bdf8" />
    <!-- AI Sightline Eye / Waveform -->
    <path d="M95 145 C115 110, 185 110, 205 145 C185 180, 115 180, 95 145 Z" fill="none" stroke="#38bdf8" stroke-width="6" />
    <circle cx="150" cy="145" r="22" fill="url(#accentGrad)" />
    <circle cx="150" cy="145" r="9" fill="#ffffff" />
    <!-- Signal waves -->
    <path d="M120 195 L180 195" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
    <path d="M132 207 L168 207" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
